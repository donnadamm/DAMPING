name: damping_app
description: "Aplikasi Pengelolaan Pelanggaran Siswa - DAMPING"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/android_bg.png
    - assets/android_fg.png
    - assets/windows.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/android_fg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#3882F6"
  image: assets/android_fg.png
  android_12:
    image: assets/android_fg.png
    color: "#3882F6"
